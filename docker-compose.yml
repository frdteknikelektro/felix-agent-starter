# Felix Agent starter deployment.
#
# The published image contains the agent, setup wizard, bundled skills, and
# runtime tools. This repository intentionally contains only deployment config
# and persistent-data directories.

x-felix-common: &felix-common
  image: ${FELIX_IMAGE:-frdinawan/felix-agent:0.3.1}
  user: "${UID:-1000}:${GID:-1000}"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid

services:
  setup:
    <<: *felix-common
    environment:
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["node", "dist/setup/terminal-main.js"]
    volumes:
      - ./:/config
      - ./workspace:/home/node
    profiles: ["setup"]
    stdin_open: true
    tty: true
    healthcheck:
      disable: true
    networks:
      - felix-net

  setup-ui:
    <<: *felix-common
    environment:
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["node", "dist/setup/index.js"]
    ports:
      - "127.0.0.1:${FELIX_SETUP_PORT:-0}:53317"
    volumes:
      - ./:/config
      - ./workspace:/home/node
    profiles: ["setup"]
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:53317/healthz'); if (!r.ok) process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - felix-net

  felix:
    <<: *felix-common
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FELIX_PORT:-0}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - .env
    volumes:
      - ./workspace:/home/node

    networks:
      - felix-net

secrets:
  .env:
    file: .env

networks:
  felix-net:
    driver: bridge
